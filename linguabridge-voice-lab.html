<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Voice lab</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#0B3B6B;background:#FFF6D6}
button{font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:999px;background:#159FE8;color:#fff;cursor:pointer;margin:4px}
table{border-collapse:collapse;width:100%;background:#fff;border-radius:12px;overflow:hidden}td,th{padding:8px 10px;border-bottom:1px solid #eee;text-align:left}
.ok{color:#0a8a43;font-weight:700}.bad{color:#c0392b;font-weight:700}</style></head><body>
<h1>Voice lab</h1>
<p>Tap <b>Test all</b>. It checks whether each version of the word ends cleanly. Then tap Play on each and tell me which ones sound complete.</p>
<p><button id="run">Test all</button> Voice: <select id="v"><option value="apollo">Apollo</option><option value="callista">Callista</option></select></p>
<table id="t"><tr><th>Text sent</th><th>Length</th><th>Ending</th><th></th></tr></table>
<script>
const C=['Hi.','Hi!','Hi...','Hi, hi.','Hi there.','Oh, hi.','Hi. Hi.','Hey.','Hello.','No.','Me.'];
const AC=window.AudioContext||window.webkitAudioContext;let ctx;
const url=(t,sp)=>'https://api.lingua-bridge.us/api/tts?engine=aura2&voice='+(sp==='callista'?'girl':'boy')+'&speaker='+sp+'&v=2&text='+encodeURIComponent(t);
const blobs={};
document.getElementById('run').onclick=async()=>{ctx=ctx||new AC();try{await ctx.resume()}catch(e){}
 const sp=document.getElementById('v').value,t=document.getElementById('t');t.innerHTML='<tr><th>Text sent</th><th>Length</th><th>Ending</th><th></th></tr>';
 for(const x of C){const tr=document.createElement('tr');tr.innerHTML='<td>'+x+'</td><td>...</td><td>...</td><td></td>';t.appendChild(tr);
  try{const r=await fetch(url(x,sp),{credentials:'include'});if(!r.ok)throw new Error('server '+r.status);const b=await r.blob();blobs[x]=b;
   const buf=await ctx.decodeAudioData(await b.arrayBuffer()),d=buf.getChannelData(0),sr=buf.sampleRate;
   let peak=0;for(let i=0;i<d.length;i++)peak=Math.max(peak,Math.abs(d[i]));
   const n=Math.floor(sr*.03);let end=0;for(let i=d.length-n;i<d.length;i++)end=Math.max(end,Math.abs(d[i]));
   const ratio=end/peak,clean=ratio<.12;
   tr.children[1].textContent=buf.duration.toFixed(2)+'s ('+b.size+' bytes)';
   tr.children[2].innerHTML='<span class="'+(clean?'ok':'bad')+'">'+(clean?'ends softly (complete)':'ends abruptly (cut off)')+'</span> ['+ratio.toFixed(2)+']';
   const pb=document.createElement('button');pb.textContent='Play';pb.onclick=async()=>{ctx.resume();const bf=await ctx.decodeAudioData(await blobs[x].arrayBuffer());const s=ctx.createBufferSource();s.buffer=bf;s.connect(ctx.destination);s.start()};tr.children[3].appendChild(pb);
  }catch(e){tr.children[1].textContent='error';tr.children[2].textContent=String(e&&e.message||e)}}};
</script></body></html>
