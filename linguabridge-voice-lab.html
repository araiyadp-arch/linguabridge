<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Voice Lab</title>
<link rel="stylesheet" href="lb-fun.css"><style>body{font-family:Lexend,system-ui,sans-serif;margin:0;padding:24px;background:linear-gradient(180deg,#CFEBFF,#FFF9F1);color:#0B3B6B}main{max-width:760px;margin:0 auto}h1{font-family:Lora,serif}h2{margin:26px 0 8px}button{margin:5px;padding:10px 16px;border-radius:999px;border:3px solid #0B3B6B;background:#fff;font:700 .95rem Lexend,system-ui;color:#0B3B6B;cursor:pointer}button.on{background:#FF7A59;color:#fff;border-color:#FF7A59}#s{width:100%;padding:12px;border-radius:14px;border:3px solid #D5E6F5;font:1rem Lexend,system-ui}#st{margin:10px 0;font-weight:600}</style></head><body><main>
<h1>Voice Lab</h1><p>Log in first (same browser), then tap a name to hear the sentence. Listen for breaths and for how friendly and lively it sounds. Tell me your favorite boy and girl voices.</p>
<input id="s" value="Hello! Good morning. My name is Bridge. Let's learn English together!"><div id="st"></div>
<h2>Melo (no breaths, one voice)</h2><button data-e="melo" data-s="x">Melo</button>
<h2>Aura 1 (current)</h2><button data-e="aura1" data-s="arcas">arcas</button><button data-e="aura1" data-s="orion">orion</button><button data-e="aura1" data-s="orpheus">orpheus</button><button data-e="aura1" data-s="angus">angus</button><button data-e="aura1" data-s="zeus">zeus</button><button data-e="aura1" data-s="perseus">perseus</button><button data-e="aura1" data-s="helios">helios</button><button data-e="aura1" data-s="luna">luna</button><button data-e="aura1" data-s="asteria">asteria</button><button data-e="aura1" data-s="athena">athena</button><button data-e="aura1" data-s="hera">hera</button><button data-e="aura1" data-s="stella">stella</button>
<h2>Aura 2 (newer)</h2><button data-e="aura2" data-s="thalia">thalia</button><button data-e="aura2" data-s="andromeda">andromeda</button><button data-e="aura2" data-s="helena">helena</button><button data-e="aura2" data-s="apollo">apollo</button><button data-e="aura2" data-s="aries">aries</button><button data-e="aura2" data-s="amalthea">amalthea</button><button data-e="aura2" data-s="aurora">aurora</button><button data-e="aura2" data-s="callista">callista</button><button data-e="aura2" data-s="cora">cora</button><button data-e="aura2" data-s="delia">delia</button><button data-e="aura2" data-s="harmonia">harmonia</button><button data-e="aura2" data-s="iris">iris</button><button data-e="aura2" data-s="juno">juno</button><button data-e="aura2" data-s="mars">mars</button><button data-e="aura2" data-s="atlas">atlas</button><button data-e="aura2" data-s="hermes">hermes</button><button data-e="aura2" data-s="jupiter">jupiter</button><button data-e="aura2" data-s="pluto">pluto</button>
</main><script>
var cur=null;document.querySelectorAll('button').forEach(function(b){b.onclick=function(){var st=document.getElementById('st');st.textContent='Loading '+b.dataset.e+' '+b.dataset.s+'...';
fetch('https://api.lingua-bridge.us/api/tts?engine='+b.dataset.e+'&speaker='+b.dataset.s+'&text='+encodeURIComponent(document.getElementById('s').value.slice(0,200)),{credentials:'include'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.blob()}).then(function(bl){if(cur)cur.pause();cur=new Audio(URL.createObjectURL(bl));document.querySelectorAll('button.on').forEach(function(x){x.className=''});b.className='on';st.textContent='Playing: '+b.dataset.e+' / '+b.dataset.s;cur.play()}).catch(function(e){st.textContent='Could not play '+b.dataset.s+' ('+e.message+'). If it says 401, log in first; 503 means that voice is not available.'})}});
</script></body></html>
